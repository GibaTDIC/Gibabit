<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIBABIT - Portal de Aplicações</title>
<meta name="description" content="Painel de gestão de aplicações GIBABIT: crie, edite, publique e organize sistemas escolares sem alterar código.">
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="manifest" id="manifestLink" href="manifest.json">
<script>
// Dois manifestos instaláveis a partir da mesma página: quem acessa
// com ?modo=aluno (o atalho do tablet da escola) instala um ícone
// próprio que já abre direto no autoatendimento; o link geral do
// site instala o portal completo. Precisa trocar antes da página
// carregar pro navegador considerar o app instalável corretamente.
if (new URLSearchParams(location.search).get("modo") === "aluno") {
    document.getElementById("manifestLink").setAttribute("href", "manifest-aluno.json");
}
</script>
</head>
<body>

<header>
    <div class="logo-block">
        <img src="images/logo1.png" alt="Gibabit" class="logo-img" onerror="this.style.display='none';">
        <div>
            <div class="logo-text">Giba<span>bit</span></div>
            <div class="logo-sub" id="logoSub">Painel de aplicações</div>
        </div>
    </div>

    <div class="search-wrap" id="searchWrap">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="Buscar por nome, categoria, autor...">
    </div>

    <div class="header-actions" id="headerActions">
        <div class="admin-toggle-wrap" id="adminStatusWrap"></div>
        <button class="btn btn-ghost btn-sm" onclick="setViewMode('aluno')" title="Autoatendimento do aluno">&#127891; Modo Aluno</button>
        <button class="btn btn-primary hidden" id="btnNovoHeader" onclick="openWizard(null)">+ Novo Programa</button>
        <button class="btn btn-ghost hidden" id="btnCategoriasHeader" onclick="openCategoriesModal()" title="Categorias">&#9881;</button>
        <div class="avatar-circle">P</div>
    </div>

    <a href="#" class="modo-completo-link hidden" id="modoCompletoLink" onclick="setViewMode('completo');return false;">Modo completo</a>
</header>

<main id="mainContent">

    <div id="completoView">

        <div id="visaoGeralWrap">
            <div class="section-title">Visão geral</div>
            <div class="stats-row" id="statsRow"></div>
        </div>

        <div class="section-title">Categorias</div>
        <div class="chips-row" id="chipsRow"></div>

        <div id="adminPanelWrap"></div>

        <div id="favoritesWrap"></div>

        <div id="recentWrap"></div>

        <div class="section-title" style="margin-top:30px;">
            <div class="grid-header">
                <span>Aplicativos</span>
                <select class="sort-select" id="sortSelect">
                    <option value="meus">Mais usados por você</option>
                    <option value="ordem">Ordem personalizada</option>
                    <option value="nome">Nome</option>
                    <option value="categoria">Categoria</option>
                    <option value="data">Data (mais recente)</option>
                    <option value="acessos">Mais utilizados (geral)</option>
                </select>
            </div>
        </div>
        <div class="cards" id="cardsGrid"></div>

    </div>

    <div id="alunoView" class="hidden aluno-view">
        <div class="orbit-stage" id="orbitStage" onclick="clearOrbitFocus()">
            <div id="orbitRings"></div>
            <div class="orbit-center">
                <img src="images/logo1.png" alt="Gibabit" onerror="this.style.display='none';">
            </div>
            <div class="orbit-planets" id="orbitPlanets"></div>
        </div>
        <div id="orbitFocusCard" onclick="clearOrbitFocus()"></div>
    </div>

</main>

<div id="modalRoot"></div>
<div id="selectionBarRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="script.js"></script>
</body>
</html>
